name: Screenshot Capture Service

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Website URL to capture'
        required: true
        type: string
      user_id:
        description: 'User identifier for the request'
        required: true
        type: string
  repository_dispatch:
    types: [screenshot_request]

permissions:
  contents: write
  actions: read

jobs:
  capture-screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up unique identifiers
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "URL=${{ github.event.inputs.url }}" >> $GITHUB_ENV
            echo "USER_ID=${{ github.event.inputs.user_id }}" >> $GITHUB_ENV
          else
            echo "URL=${{ github.event.client_payload.url }}" >> $GITHUB_ENV
            echo "USER_ID=${{ github.event.client_payload.user_id }}" >> $GITHUB_ENV
          fi
          echo "TIMESTAMP=$(date +%s)" >> $GITHUB_ENV
          echo "UNIQUE_ID=$(uuidgen | cut -d'-' -f1)" >> $GITHUB_ENV
          echo "REQUEST_ID=${UNIQUE_ID}_${TIMESTAMP}" >> $GITHUB_ENV
      
      - name: Create downloads directory
        run: mkdir -p downloads
      
      - name: Capture screenshot
        id: capture
        run: |
          ENCODED_URL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ env.URL }}', safe=''))")
          FILENAME="screenshot_${{ env.REQUEST_ID }}_user${{ env.USER_ID }}.png"
          FILEPATH="downloads/${FILENAME}"
          
          echo "Capturing: ${{ env.URL }}"
          curl -s -o "${FILEPATH}" "https://api.screenshotmachine.com/?key=dd29ad&url=${ENCODED_URL}&dimension=1024x1024"
          
          if [ -f "${FILEPATH}" ] && [ -s "${FILEPATH}" ]; then
            FILESIZE=$(stat -c%s "${FILEPATH}")
            echo "✅ Success: ${FILENAME} (${FILESIZE} bytes)"
            echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
            echo "filesize=${FILESIZE}" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to capture"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Commit screenshot
        if: steps.capture.outputs.status == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add downloads/${{ steps.capture.outputs.filename }}
          git commit -m "📸 Screenshot for request ${{ env.REQUEST_ID }}" || echo "No changes"
          git push origin ${{ github.ref_name }} || echo "Push failed"
      
      - name: Save metadata
        if: steps.capture.outputs.status == 'success'
        run: |
          cat > downloads/${{ env.REQUEST_ID }}_user${{ env.USER_ID }}.json << EOF
          {
            "request_id": "${{ env.REQUEST_ID }}",
            "user_id": "${{ env.USER_ID }}",
            "url": "${{ env.URL }}",
            "filename": "${{ steps.capture.outputs.filename }}",
            "filesize": ${{ steps.capture.outputs.filesize }},
            "timestamp": ${{ env.TIMESTAMP }},
            "status": "completed",
            "download_url": "https://raw.githubusercontent.com/${{ github.repository }}/main/downloads/${{ steps.capture.outputs.filename }}"
          }
          EOF
          
          git add downloads/${{ env.REQUEST_ID }}_user${{ env.USER_ID }}.json
          git commit -m "📋 Metadata for ${{ env.REQUEST_ID }}" || echo "No changes"
          git push origin ${{ github.ref_name }} || echo "Push failed"
      
      - name: Summary
        run: |
          echo "📊 Request ID: ${{ env.REQUEST_ID }}"
          echo "👤 User ID: ${{ env.USER_ID }}"
          echo "🌐 URL: ${{ env.URL }}"
          echo "📁 File: ${{ steps.capture.outputs.filename }}"
          echo "📦 Size: ${{ steps.capture.outputs.filesize }} bytes"
